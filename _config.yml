# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 陆桥屿の博客
subtitle: ᰔᩚ遇涵🌧️转情oᴗO๑
description: 持续创作中
keywords: 后端, Java, C#
author: 陆桥屿
language: zh-CN # 这里只可以选 zh-CN、zh-HK、zh-TW、ja、en 这几个格式
timezone: "Asia/Shanghai"

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://ysx.cosine.ren/
permalink: :link/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks
# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: false
  line_number: true
  auto_detect: false
  tab_replace: ""
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ""

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ""
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
  随笔: life

  测试: test

  笔试面经: review
  笔试复盘: exam-record
  面经: interview

  题目记录: coding-train
  竞赛: contest
  字节校园: bytedance
  剑指offer: offer

  项目集锦: project

  笔记: note
  青训营笔记: bytedance-note
  算法: algorithm
  后端: back-end
  前端: front-end
  JavaScript: javascript
  React: react
  CS基础: cs-basics
  数据结构: data-structure
  服务器: server

  工具: tools
  教程: tutorial
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: "mtime"

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: shoka

markdown:
  render: # 渲染器设置
    html: false # 过滤 HTML 标签
    xhtmlOut: true # 使用 '/' 来闭合单标签 （比如 <br />）。
    breaks: true # 转换段落里的 '\n' 到 <br>。
    linkify: true # 将类似 URL 的文本自动转换为链接。
    typographer:
    quotes: "“”‘’"
  plugins: # markdown-it 插件设置
    - plugin:
        name: markdown-it-toc-and-anchor
        enable: true
        options: # 文章目录以及锚点应用的 class 名称，shoka 主题必须设置成这样
          tocClassName: "toc"
          anchorClassName: "anchor"
    - plugin:
        name: markdown-it-multimd-table
        enable: true
        options:
          multiline: true
          rowspan: true
          headerless: true
    - plugin:
        name: ./markdown-it-furigana
        enable: true
        options:
          fallbackParens: "()"
    - plugin:
        name: ./markdown-it-spoiler
        enable: true
        options:
          title: "你知道得太多了"

minify:
  html:
    enable: true
    exclude: # 排除 hexo-feed 用到的模板文件
      - "**/json.ejs"
      - "**/atom.ejs"
      - "**/rss.ejs"
  css:
    enable: true
    exclude:
      - "**/*.min.css"
  js:
    enable: true
    mangle:
      toplevel: true
    output:
    compress:
    exclude:
      - "**/*.min.js"

autoprefixer:
  exclude:
    - "*.min.css"

algolia:
  appId: #Your algolia appId
  apiKey: #Your algolia apiKey (Search api)
  adminApiKey: #Your algolia adminApiKey
  chunkSize: 5000
  indexName: cos_blogs # algolia index name
  fields:
    - title #必须配置
    - path #必须配置
    - categories #推荐配置
    - content:strip:truncate,0,2000
    - gallery
    - photos
    - tags

feed:
  limit: 20
  order_by: "-date"
  tag_dir: false
  category_dir: false
  rss:
    enable: true
    template: "themes/shoka/layout/_alternate/rss.ejs"
    output: "rss.xml"
  atom:
    enable: true
    template: "themes/shoka/layout/_alternate/atom.ejs"
    output: "atom.xml"
  jsonFeed:
    enable: true
    template: "themes/shoka/layout/_alternate/json.ejs"
    output: "feed.json"
# Deployment
# Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: # or https://gitee.com/<yourAccount>/<repo>
  branch: # branch

# 自动生成front-matter字段的hexo插件
# https://github.com/RayKr/hexo-auto-front-matter
auto_front_matter:
  enable: true
  # 是否保留原来的front-matter顺序
  # 'order'是一个列表，默认为空。在这种情况下，更新的front-matter字段将顺序保持在原始文本中。
  # 当'order'不为空时，front-matter将按以下顺序排序，支持少于或多于原文front-matter的真实数量。
  order:
  # - title
  # - date
  # - categories
  # - tags
  # - cover
  # - description

  # 从文件名自动添加标题
  auto_title:
    enable: true
    # 两种模式：仅当标题为空时使用“模式”控制写入，或始终覆盖。
    # 1: 仅当标题为空自动添加（默认）
    # 2: 始终使用文件名覆盖标题
    mode: 1

  # 如果为空，则自动添加现在的日期
  auto_date:
    enable: true

  # 逻辑与 auto_category 相同
  # https://github.com/xu-song/hexo-auto-category
  auto_categories:
    enable: false
    multiple: false
    depth:

  # 当标签为空时自动将类别列表附加到标签
  auto_tags:
    enable: true

  # 从"per_category"列表中自动添加封面图片路径
  auto_cover:
    enable: true
    # 定义每个类别的封面图片路径
    # 当存在嵌套类别时，它会选择最深的类别匹配。
    per_category:
    # - Hexo: /img/xxxx.png